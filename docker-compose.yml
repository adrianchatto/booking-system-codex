services:
  bookright:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bookright:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/bookright
      NEXTAUTH_SECRET: ${SERVICE_PASSWORD_NEXTAUTH}
      NEXTAUTH_URL: https://bookingcodex.chattoweb.com
      NEXT_PUBLIC_ROOT_DOMAIN: bookingcodex.chattoweb.com
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NODE_ENV: production
    ports:
      - "3000"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookright
      POSTGRES_USER: bookright
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - bookright_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookright -d bookright"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bookright_postgres_data:
